name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        run: go tool govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - name: Lint OpenAPI document
        run: make api-lint
      - name: Lint protobuf and check generated code is up to date
        run: |
          make proto
          git add --intent-to-add gen rust/src/gen
          git diff --exit-code -- gen rust/src/gen || {
            echo "::error::Generated code is out of date: run 'make proto' and commit the result."
            exit 1
          }

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust crate (fmt, clippy, tests, no_std build)
        run: make rust

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Admin page (type-check and build)
        run: make admin-ui

  eufy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Eufy proxy (type-check and test)
        run: make eufy

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: End-to-end tests (binary, Docker image, Rust client, admin page)
        # Builds the admin page, starts the local Supabase, and fails rather
        # than skips if anything is unavailable.
        run: make e2e
