# LCARS API configuration.
#
# Copy this file to lcars.toml and edit it:
#
#   cp lcars.example.toml lcars.toml
#
# lcars.toml is gitignored, so your paths and settings stay on your machine.
# The server reads ./lcars.toml from its working directory, or the file named
# by the LCARS_CONFIG environment variable.
#
# Every setting is optional; the defaults are shown commented out. Each one can
# also be set with the environment variable named next to it, which takes
# precedence over this file. All values are strings, so keep the quotes.

# Address the HTTP server listens on (health check, docs and JSON endpoints).
# Use "127.0.0.1:8080" to accept local connections only.
# Env: LCARS_ADDR
# addr = ":8080"

# Log verbosity: "debug", "info", "warn" or "error".
# Env: LCARS_LOG_LEVEL
# log_level = "info"

# Log format: "json" (one object per line) or "text" (easier to read).
# Env: LCARS_LOG_FORMAT
# log_format = "json"

# How long to let in-flight requests finish on shutdown.
# Env: LCARS_SHUTDOWN_TIMEOUT
# shutdown_timeout = "10s"

# Timezone for "today" and for event times, as an IANA name such as
# "America/New_York" or "Europe/Berlin". Defaults to the host's timezone.
# Env: LCARS_TIMEZONE
# timezone = "America/New_York"

[calendar]
# Directory of .ics files to serve on lcars.calendar.get (NATS) and
# GET /calendar (HTTP). Subdirectories are read too. "~/" means your home
# directory, and a relative path is relative to this file. Leave unset to
# disable the calendar.
# Env: LCARS_CALENDAR_DIR
# dir = "~/Calendars"

# How often to re-read the directory. Minimum "1s".
# Env: LCARS_CALENDAR_REFRESH_INTERVAL
# refresh_interval = "1h"

[nats]
# The API is served over NATS. By default lcars-api runs its own embedded
# NATS server, which devices connect to at nats://<this host>:4222. Devices
# need a token to connect when [supabase] is configured; otherwise anyone on
# the network can, so keep it on a trusted network.
#
# Address the embedded NATS server listens on. Use "127.0.0.1:4222" to accept
# local connections only. Ignored when url is set.
# Env: LCARS_NATS_ADDR
# addr = ":4222"

# Connect to an existing NATS server instead of running the embedded one.
# Several servers can be listed, separated by commas. The TLS settings below
# apply only to the embedded server, and are ignored when url is set.
# Env: LCARS_NATS_URL
# url = "nats://192.0.2.10:4222"

# PEM certificate and private key for the embedded server. When both are set,
# devices connect with tls://. The certificate's subject alternative names
# must include every DNS name or IP they dial.
# Env: LCARS_NATS_TLS_CERT
# tls_cert = "/srv/lcars/server.pem"

# Env: LCARS_NATS_TLS_KEY
# tls_key = "/srv/lcars/server.key"

# DNS names and IP addresses that must appear in the certificate, separated
# by commas. When tls_cert and tls_key are unset, a CA and server certificate
# are written to tls_dir on first start and reused after that. Delete that
# directory to mint a new CA; devices then need the new ca.pem.
# Env: LCARS_NATS_TLS_HOSTS
# tls_hosts = "192.0.2.10"

# Directory for a generated CA (ca.pem, ca.key) and server certificate
# (server.pem, server.key). Required when tls_hosts is set without tls_cert.
# Env: LCARS_NATS_TLS_DIR
# tls_dir = "/srv/lcars/nats-tls"

[supabase]
# Device tokens, the admins who manage them, and the reminder list are stored
# in Supabase (a local one started with `supabase start` in this repository).
# When these are set, devices must authenticate with a token (HTTP Basic
# auth, or user/password on NATS), the admin page at /admin/ is enabled, and
# reminders can be added, removed, and marked done. Leave them unset to run
# without authentication; reminders are off too.
#
# `supabase status` prints both values. The secret key grants full access to
# the database: keep it in this file (which is gitignored) or the environment,
# never in the repository.

# The API URL.
# Env: LCARS_SUPABASE_URL
# url = "http://127.0.0.1:54321"

# The secret key (sb_secret_...), or the legacy service_role key.
# Env: LCARS_SUPABASE_SECRET_KEY
# secret_key = "sb_secret_REPLACE_ME"

# How often to re-read the device tokens, to pick up changes made directly in
# the database (changes made on the admin page apply immediately).
# Minimum "1s".
# Env: LCARS_SUPABASE_REFRESH_INTERVAL
# refresh_interval = "1m"

[eufy]
# The Eufy camera proxy (see eufy/README.md). When set, devices can list
# cameras and open their live video through this server. The proxy itself
# stays on this machine; devices talk only to lcars-api. Leave unset to
# disable cameras.
# Env: LCARS_EUFY_URL
# url = "http://127.0.0.1:3000"
