[package]
name = "lcars-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Protobuf types and NATS subjects for the lcars-api home display API"
license = "MIT"
repository = "https://github.com/asilluron/lcars-api"
readme = "README.md"
keywords = ["lcars", "nats", "protobuf", "prost"]
categories = ["embedded", "encoding", "no-std"]

[features]
default = ["std"]
# Disable default features for no_std targets (alloc is still required).
std = ["prost/std"]

[dependencies]
prost = { version = "0.14.4", default-features = false, features = ["derive"] }

[dev-dependencies]
async-nats = "0.50.0"
futures = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread"] }
